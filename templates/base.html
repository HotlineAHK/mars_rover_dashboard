<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Mars Rover Mission Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark text-light">
    <header class="navbar navbar-dark bg-black border-bottom border-secondary mb-4 shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold tracking-wider text-danger">🔴 MARS ROVER · MISSION CONTROL</span>
            <span class="text-muted small">STATUS: LIVE TELEMETRY</span>
        </div>
    </header>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 bg-black border-top border-secondary text-muted small fixed-bottom">
        Связь: задержка 12 мин
    </footer>
</body>
</html>
